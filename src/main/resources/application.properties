# Nombre del proyecto en el ecosistema Spring
spring.application.name=springpoo

# Puerto HTTP en el que se ejecuta el servidor web embebido (Tomcat)
server.port=8080

# Ruta del archivo de configuración del framework de logs (Log4j2)
logging.config=classpath:log4j2.xml

# Nivel de logging específico para nuestro paquete raíz. DEBUG permite ver trazas detalladas y queries
logging.level.com.sena.springpoo=DEBUG

# ──────────────────────────────────────────────────────────────────
#  CONFIGURACIÓN DE LA BASE DE DATOS MySQL (Activa por defecto)
# ──────────────────────────────────────────────────────────────────
# URL de conexión JDBC a MySQL con parámetros adicionales:
# - createDatabaseIfNotExist=true: Crea automáticamente la base de datos 'springpoo' si no existe.
# - useSSL=false: Desactiva SSL para evitar problemas de certificados en local.
# - serverTimezone=UTC: Define la zona horaria del servidor.
# - allowPublicKeyRetrieval=true: Permite la autenticación con RSA en MySQL 8+.
spring.datasource.url=jdbc:mysql://localhost:3306/springpoo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# Usuario de conexión a MySQL (por defecto en XAMPP es 'root')
spring.datasource.username=root

# Contraseña del usuario MySQL (por defecto en XAMPP está vacía)
spring.datasource.password=


# ──────────────────────────────────────────────────────────────────
#  CONFIGURACIÓN ALTERNATIVA: BASE DE DATOS EN MEMORIA H2 (Comentada)
# ──────────────────────────────────────────────────────────────────
# # spring.datasource.url=jdbc:h2:mem:springpoodb;DB_CLOSE_DELAY=-1;MODE=MySQL
# # spring.datasource.driver-class-name=org.h2.Driver
# # spring.datasource.username=sa
# # spring.datasource.password=
# # spring.h2.console.enabled=true
# # spring.h2.console.path=/h2-console


# ──────────────────────────────────────────────────────────────────
#  INICIALIZACIÓN Y FILTROS DE SPRING MVC / THYMELEAF
# ──────────────────────────────────────────────────────────────────
# Define si se ejecutan los scripts SQL de inicialización (como schema.sql).
# 'always' asegura que se cargue e inicialice el esquema al iniciar el servidor.
spring.sql.init.mode=always

# Habilita el filtro de métodos ocultos. Permite recibir peticiones PUT o DELETE
# a través de formularios HTML usando campos ocultos como '_method'.
spring.mvc.hiddenmethod.filter.enabled=true

# Desactiva la caché de plantillas de Thymeleaf. Permite visualizar los cambios
# en los archivos HTML inmediatamente en caliente sin reiniciar la aplicación.
spring.thymeleaf.cache=false


# ──────────────────────────────────────────────────────────────────
#  MANEJO DE ERRORES GLOBALES
# ──────────────────────────────────────────────────────────────────
# Incluye el mensaje detallado de la excepción en la respuesta de error de Spring.
server.error.include-message=always

# Incluye los errores de binding (fallos de validación de campos) en el objeto de error.
server.error.include-binding-errors=always