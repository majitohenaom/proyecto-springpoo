<!DOCTYPE html>
<!-- 
  VISTA PRINCIPAL / PANEL DE CONTROL - PLATAFORMA SENA GDF
  Esta página contiene el panel administrativo de usuarios.
  Incluye:
  - Sistema de notificaciones emergentes (Toasts).
  - Encabezado con soporte dinámico para cambio de idioma (ES/EN).
  - Sección hero para mostrar imagen representativa cargada dinámicamente.
  - Formulario de creación de usuarios.
  - Listado de usuarios cargados de forma asíncrona mediante fetch API REST.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SENA GDF — Gestión Premium</title>
    <!-- Importación de Google Fonts: Cormorant Garamond para títulos elegantes y Jost para el cuerpo -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@300;400;500;600;800&display=swap" rel="stylesheet"/>
    <style>
        /* Definición de la paleta de colores y variables globales de la aplicación */
        :root {
          --bg:#0a0910; 
          --surface:#151221; 
          --card:#1d192e; 
          --border:#2f2a4a; 
          --border2:#25213b;
          --purple:#8e44ad; 
          --purple-glow:rgba(142,68,173,.3); 
          --green:#2ecc71; 
          --green-glow:rgba(46,204,113,.2);
          --text:#f0f0f5; 
          --text2:#a09abc; 
          --red:#e74c3c;
          --serif:'Cormorant Garamond',serif; 
          --sans:'Jost',sans-serif;
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}

        /* ── SISTEMA DE TOASTS (Notificaciones flotantes temporales) ── */
        #toasts{position:fixed;top:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:340px;width:100%;}
        .toast{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:12px;border-left:4px solid transparent;background:rgba(21,18,33,.98);backdrop-filter:blur(15px);font-size:.85rem;animation:tIn .3s ease;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,0.6);border:1px solid var(--border);}
        @keyframes tIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}
        .toast.out{animation:tOut .3s ease forwards;}
        @keyframes tOut{to{opacity:0;transform:translateX(20px);}}
        .t-success{border-left-color:var(--green);}
        .t-error{border-left-color:var(--red);}
        .t-info{border-left-color:var(--purple);}
        .t-title{font-weight:700;margin-bottom:2px;}
        .t-success .t-title{color:var(--green);}
        .t-error .t-title{color:var(--red);}
        .t-info .t-title{color:var(--purple);}

        /* ── BARRA DE NAVEGACIÓN STICKY ── */
        nav{border-bottom:1px solid var(--border);background:rgba(10,9,16,.9);backdrop-filter:blur(20px);padding:0 60px;display:flex;align-items:center;height:72px;gap:32px;position:sticky;top:0;z-index:100;}
        .brand{font-family:var(--serif);font-size:1.8rem;font-weight:700;letter-spacing:.1em;color:var(--green);text-decoration:none;}
        .brand span{color:var(--purple);font-weight:300;}
        .nav-right{margin-left:auto;display:flex;gap:14px;}
        .lang-btn{background:transparent;border:1px solid var(--border);color:var(--text2);cursor:pointer;padding:6px 14px;border-radius:8px;font-size:.75rem;font-weight:600;transition:0.2s;}
        .lang-btn.active{background:var(--green);color:#000;border-color:var(--green);}

        /* ── SECCIÓN HERO (Encabezado Visual) ── */
        .hero{background:linear-gradient(135deg,#0a0910 0%,#151221 100%);padding:60px;display:flex;align-items:center;gap:60px;border-bottom:1px solid var(--border);position:relative;}
        .hero-img-wrap{width:220px;height:220px;border-radius:20px;overflow:hidden;border:2px solid var(--purple);box-shadow:0 0 50px var(--purple-glow);position:relative;}
        .hero-img{width:100%;height:100%;object-fit:cover;}
        .hero-title{font-family:var(--serif);font-size:3.5rem;line-height:1;margin-bottom:15px;}
        .hero-title em{color:var(--green);font-style:normal;}
        .hero-desc{color:var(--text2);max-width:450px;margin-bottom:30px;font-size:.95rem;}

        /* ── DISEÑO GRID DE CONTENIDO ── */
        .layout{max-width:1300px;margin:0 auto;padding:50px 40px;display:grid;grid-template-columns:1fr 420px;gap:50px;}

        /* ── SECCIÓN CATÁLOGO (Listado de Usuarios) ── */
        .catalog-header{display:flex;align-items:center;gap:15px;margin-bottom:25px;}
        .catalog-header h2{font-family:var(--serif);font-size:2rem;color:var(--green);}
        .cat-line{flex:1;height:1px;background:var(--border);}

        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}
        
        /* Tarjeta de usuario con efectos de hover sutiles */
        .u-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;transition:0.3s;position:relative;overflow:hidden;}
        .u-card:hover{border-color:var(--purple);transform:translateY(-5px);box-shadow:0 15px 40px rgba(0,0,0,0.5);}
        .u-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--purple);opacity:0;transition:0.3s;}
        .u-card:hover::before{opacity:1;}

        .u-header{display:flex;gap:15px;align-items:center;margin-bottom:15px;}
        .u-avatar{width:45px;height:45px;background:var(--surface);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--green);}
        .u-name{font-weight:700;font-size:1.05rem;}
        .u-doc{font-family:var(--sans);font-size:.75rem;color:var(--purple);background:var(--purple-glow);padding:2px 8px;border-radius:5px;}
        
        .u-body{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.8rem;color:var(--text2);}
        .u-item span{display:block;font-size:.65rem;text-transform:uppercase;color:var(--green);letter-spacing:1px;margin-bottom:2px;}
        
        /* Botones de acción dentro de la tarjeta */
        .u-actions{position:absolute;top:15px;right:15px;display:flex;gap:8px;}
        .a-btn{width:32px;height:32px;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s;}
        .a-del{background:var(--red);color:white;}
        .a-del:hover{transform:scale(1.1);filter:brightness(1.2);}

        /* ── PANEL DE REGISTRO / FORMULARIO ── */
        .f-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px;position:sticky;top:100px;}
        .f-head{margin-bottom:25px;border-bottom:1px solid var(--border);padding-bottom:15px;}
        .f-head h3{font-family:var(--serif);font-size:1.5rem;color:var(--green);}
        
        .f-body{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
        .field{display:flex;flex-direction:column;gap:6px;}
        .field.full{grid-column:1/-1;}
        .field label{font-size:.65rem;text-transform:uppercase;color:var(--text2);letter-spacing:1px;}
        .field input, .field select{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;color:white;font-family:var(--sans);outline:none;transition:0.3s;}
        .field input:focus{border-color:var(--purple);box-shadow:0 0 15px var(--purple-glow);}

        .s-btn{grid-column:1/-1;margin-top:10px;padding:15px;border:none;border-radius:12px;cursor:pointer;background:var(--green);color:#000;font-weight:800;text-transform:uppercase;letter-spacing:1px;transition:0.3s;}
        .s-btn:hover{filter:brightness(1.1);transform:scale(1.02);box-shadow:0 8px 30px var(--green-glow);}

        footer{border-top:1px solid var(--border);padding:30px 60px;display:flex;justify-content:space-between;align-items:center;font-size:.75rem;color:var(--text2);}
        .f-tag{color:var(--purple);font-weight:700;}

        @media(max-width:1000px){.layout{grid-template-columns:1fr;}}

        /* ── PRELOADER DE BIENVENIDA (Pantalla de Carga) ── */
        #preloader{position:fixed;inset:0;background:var(--bg);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s,visibility .5s;}
        #preloader.hide{opacity:0;visibility:hidden;}
        .spinner{width:50px;height:50px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .pre-text{font-size:.7rem;letter-spacing:4px;color:var(--text2);text-transform:uppercase;animation:pulse 1.5s ease-in-out infinite;}
        @keyframes pulse{0%,100%{opacity:.5;}50%{opacity:1;}}
    </style>
</head>
<body>

<!-- Pantalla de carga inicial animada -->
<div id="preloader">
    <div class="spinner"></div>
    <div class="pre-text" data-es="Iniciando GDF..." data-en="Starting GDF...">Iniciando GDF...</div>
</div>

<!-- Contenedor global de Toasts -->
<div id="toasts"></div>

<!-- Navegación y selector de idiomas -->
<nav>
    <a href="#" class="brand">SENA<span>GDF</span></a>
    <div class="nav-right">
        <!-- Botones con onclick que desencadenan el cambio de idioma dinámico -->
        <button class="lang-btn active" onclick="setLang('es')" id="btn-es">ES</button>
        <button class="lang-btn" onclick="setLang('en')" id="btn-en">EN</button>
    </div>
</nav>

<!-- Cabecera de la página (Hero) -->
<div class="hero">
    <div class="hero-img-wrap">
        <!-- Imagen que se consulta a la API REST /usuarios/imagen -->
        <img id="hero-img" src="" class="hero-img" alt="GDF"/>
    </div>
    <div class="hero-content">
        <h1 class="hero-title">
            <span data-es="Gestión de" data-en="Management of">Gestión de</span><br/>
            <em data-es="Usuarios GDF." data-en="GDF Users.">Usuarios GDF.</em>
        </h1>
        <p class="hero-desc" data-es="Administra los perfiles de formación profesional de manera eficiente y moderna." data-en="Efficiently and modernly manage professional training profiles.">
            Administra los perfiles de formación profesional de manera eficiente y moderna.
        </p>
    </div>
</div>

<!-- Estructura principal de la página -->
<div class="layout">
    <!-- Lado izquierdo: Lista de usuarios registrados -->
    <div class="catalog">
        <div class="catalog-header">
            <h2 data-es="Usuarios Registrados" data-en="Registered Users">Usuarios Registrados</h2>
            <div class="cat-line"></div>
        </div>
        <div class="grid" id="grid">
            <!-- Cargado vía JS dinámicamente -->
        </div>
    </div>

    <!-- Lado derecho: Formulario interactivo para registrar un nuevo usuario -->
    <div class="panel">
        <div class="f-card">
            <div class="f-head">
                <h3 data-es="Registrar Usuario" data-en="Register User">Registrar Usuario</h3>
            </div>
            <div class="f-body">
                <div class="field">
                    <label data-es="Primer Nombre" data-en="First Name">Primer Nombre</label>
                    <input id="u-pnom" type="text" placeholder="...">
                </div>
                <div class="field">
                    <label data-es="Segundo Nombre" data-en="Middle Name">Segundo Nombre</label>
                    <input id="u-snom" type="text" placeholder="...">
                </div>
                <div class="field">
                    <label data-es="Primer Apellido" data-en="First Last Name">Primer Apellido</label>
                    <input id="u-pape" type="text" placeholder="...">
                </div>
                <div class="field">
                    <label data-es="Segundo Apellido" data-en="Second Last Name">Segundo Apellido</label>
                    <input id="u-sape" type="text" placeholder="...">
                </div>
                <div class="field">
                    <label data-es="Tipo Doc." data-en="Doc Type">Tipo Doc.</label>
                    <select id="u-tipo">
                        <option value="CC">CC</option>
                        <option value="TI">TI</option>
                        <option value="CE">CE</option>
                    </select>
                </div>
                <div class="field">
                    <label data-es="Documento" data-en="ID Number">Documento</label>
                    <input id="u-doc" type="text" placeholder="...">
                </div>
                <div class="field">
                    <label data-es="Celular" data-en="Phone">Celular</label>
                    <input id="u-cel" type="text" placeholder="...">
                </div>
                <div class="field">
                    <label data-es="Grupo" data-en="Group">Grupo</label>
                    <input id="u-grp" type="text" placeholder="...">
                </div>
                <div class="field full">
                    <label data-es="Correo Electrónico" data-en="Email">Correo Electrónico</label>
                    <input id="u-em" type="email" placeholder="...">
                </div>
                <div class="field full">
                    <label data-es="Contraseña" data-en="Password">Contraseña</label>
                    <input id="u-pass" type="password" placeholder="...">
                </div>
                <button class="s-btn" onclick="guardar()">
                    <span data-es="CREAR CUENTA" data-en="CREATE ACCOUNT">CREAR CUENTA</span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Pie de página -->
<footer>
    <p>SENA Centro de Formación · GDF Edition</p>
    <div class="f-tag">SPRING BOOT + REST API</div>
</footer>

<!-- ── INTERACTIVIDAD Y CONSUMO DE API REST ── -->
<script th:inline="javascript">
    // Variable global de idioma ('es' por defecto)
    let lang = 'es';
    
    // Control de tiempo para mitigar spam de clics repetitivos en peticiones AJAX
    let lastActionTime = 0;
    const COOLDOWN = 2000; // 2 segundos de espera mínimo

    /**
     * Valida que no se hagan clics excesivos de spam que saturen la API REST.
     * Muestra un Toast de advertencia en caso de detectar abuso.
     * @returns {boolean} true si está bajo período de cooldown
     */
    function checkSpam() {
        const now = Date.now();
        if (now - lastActionTime < COOLDOWN) {
            toast('error', 
                lang==='es'?'¡Acción Bloqueada!':'Action Blocked!', 
                lang==='es'?'Por favor, espera 2 segundos. No satures el sistema.':'Please wait 2 seconds. Do not saturate the system.'
            );
            return true;
        }
        lastActionTime = now;
        return false;
    }

    /**
     * Cambia dinámicamente el idioma de la interfaz del usuario.
     * Lee los atributos 'data-es' o 'data-en' de los elementos traducibles y actualiza su contenido.
     * @param {string} l Código del idioma ('es' o 'en')
     */
    function setLang(l) {
        lang = l;
        document.getElementById('btn-es').classList.toggle('active', l==='es');
        document.getElementById('btn-en').classList.toggle('active', l==='en');
        document.querySelectorAll('[data-'+l+']').forEach(el => el.textContent = el.getAttribute('data-'+l));
        consultar(); // Recarga la lista aplicando el delay controlado
    }

    /**
     * Crea y muestra una notificación temporal (Toast) en la esquina superior derecha.
     * @param {string} tipo Tipo de toast ('success', 'error', 'info')
     * @param {string} t Título del mensaje
     * @param {string} m Cuerpo del mensaje
     */
    function toast(tipo, t, m) {
        const c = document.getElementById('toasts');
        const el = document.createElement('div');
        el.className = `toast t-${tipo}`;
        el.innerHTML = `<div style="flex:1"><div class="t-title">${t}</div><div class="t-msg">${m}</div></div>`;
        el.onclick = () => el.remove(); // Se elimina al hacerle clic
        c.appendChild(el);
        setTimeout(() => el.remove(), 4000); // Expiración a los 4 segundos
    }

    /**
     * Obtiene y asigna la URL de la imagen principal del Hero llamando al endpoint /usuarios/imagen.
     */
    async function cargarRecursos() {
        try {
            const res = await fetch('/usuarios/imagen');
            const data = await res.json();
            document.getElementById('hero-img').src = data.imagenUrl;
        } catch(e) { console.error(e); }
    }

    /**
     * Realiza una consulta GET HTTP a la API REST para listar los usuarios registrados.
     * Genera dinámicamente las tarjetas HTML (u-card) del catálogo con sus datos y botón de borrado.
     */
    async function consultar() {
        if (checkSpam()) return;
        try {
            const res = await fetch('/usuarios/lista');
            const data = await res.json();
            const grid = document.getElementById('grid');
            if (data.usuarios.length === 0) {
                grid.innerHTML = '<p style="color:var(--text2)">No hay usuarios registrados.</p>';
                return;
            }
            grid.innerHTML = data.usuarios.map(u => `
                <div class="u-card">
                    <div class="u-actions">
                        <!-- Llama a la función de borrado enviando el ID único del usuario -->
                        <button class="a-btn a-del" onclick="eliminar(${u.id})">✕</button>
                    </div>
                    <div class="u-header">
                        <div class="u-avatar">👤</div>
                        <div>
                            <div class="u-name">${u.primerNombre} ${u.primerApellido}</div>
                            <span class="u-doc">${u.tipoDocumento} ${u.documento}</span>
                        </div>
                    </div>
                    <div class="u-body">
                        <div class="u-item"><span>Email</span>${u.correoElectronico}</div>
                        <div class="u-item"><span>Celular</span>${u.celular}</div>
                        <div class="u-item"><span>Grupo</span>${u.grupoFormacion || '—'}</div>
                        <div class="u-item"><span>ID</span>#${u.id}</div>
                    </div>
                </div>
            `).join('');
        } catch(e) {
            toast('error', 'Error 500', 'No se pudo conectar con el servidor.');
        }
    }

    /**
     * Toma los datos del formulario, construye un JSON y realiza una petición POST HTTP 
     * a /usuarios/guardar para almacenar el nuevo registro en la base de datos MySQL.
     */
    async function guardar() {
        if (checkSpam()) return;
        const body = {
            primerNombre: document.getElementById('u-pnom').value,
            segundoNombre: document.getElementById('u-snom').value,
            primerApellido: document.getElementById('u-pape').value,
            segundoApellido: document.getElementById('u-sape').value,
            tipoDocumento: document.getElementById('u-tipo').value,
            documento: document.getElementById('u-doc').value,
            celular: document.getElementById('u-cel').value,
            grupoFormacion: document.getElementById('u-grp').value,
            correoElectronico: document.getElementById('u-em').value,
            contrasena: document.getElementById('u-pass').value
        };

        try {
            const res = await fetch('/usuarios/guardar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (res.ok) {
                toast('success', lang==='es'?'Éxito':'Success', data.mensaje);
                consultar(); // Recarga la lista de usuarios
                // Limpieza de todos los campos del formulario tras creación exitosa
                ['u-pnom','u-snom','u-pape','u-sape','u-doc','u-cel','u-grp','u-em','u-pass'].forEach(id => document.getElementById(id).value = '');
            } else {
                toast('error', 'Error ' + res.status, data.mensaje || data.detalle);
            }
        } catch(e) {
            toast('error', 'Error', 'Fallo en la conexión');
        }
    }

    /**
     * Envía una solicitud DELETE HTTP al servidor para borrar un usuario por su ID.
     * @param {number} id Identificador único del usuario a eliminar
     */
    async function eliminar(id) {
        try {
            const res = await fetch('/usuarios/borrar/' + id, {method: 'DELETE'});
            if (res.ok) {
                toast('info', 'Eliminado', 'Usuario borrado de la base de datos');
                consultar();
            }
        } catch(e) { toast('error', 'Error', 'No se pudo eliminar'); }
    }

    // Inicializaciones al cargar completamente la ventana del navegador
    window.onload = () => {
        cargarRecursos();
        consultar();
        // Oculta el preloader inicial con una pequeña transición tras 1 segundo
        setTimeout(() => {
            document.getElementById('preloader').classList.add('hide');
        }, 1000);
    };
</script>
</body>
</html>
